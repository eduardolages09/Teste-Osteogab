<!doctype html>
<html lang="pt">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Osteogab">
<meta name="theme-color" content="#171615">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Osteogab · Sessões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Poppins:wght@500;600;700&display=swap">
<style>
/* Layout: barra superior fina + área de trabalho. Na sessão: barra preta "em curso", lista de exercícios à esquerda e o exercício atual à direita (iPad na horizontal). Relatório: folha A4 branca, pronta a imprimir.
   Cores tiradas da clínica: preto da marca, branco quente das paredes, areia da madeira e das fardas. */
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --surface-2:#EFECE7; --ink:#171615; --muted:#6D6860; --line:#E4DFD7;
  --accent:#171615; --accent-ink:#FFFFFF;
  --sand:#A88C68; --sand-soft:#F2EBE0; --sand-ink:#7A6243;
  --ok:#3E7A55; --ok-soft:#E3EEE6; --warn:#9E6A14; --warn-soft:#F5EAD6; --bad:#B0452F; --bad-soft:#F6E1DB;
  --bar:#171615; --bar-ink:#F7F6F3;
  --av1:#171615; --av2:#8A7458; --av3:#5D6E66;
  --shadow:0 1px 2px rgba(23,22,21,.05),0 6px 20px rgba(23,22,21,.06);
  --display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131211; --surface:#1C1B19; --surface-2:#272522; --ink:#F1EEE9; --muted:#A29C92; --line:#34312D;
    --accent:#F1EEE9; --accent-ink:#131211;
    --sand:#C8AE88; --sand-soft:#2E2820; --sand-ink:#D8C19E;
    --ok:#72B38C; --ok-soft:#1D2C23; --warn:#D9A552; --warn-soft:#30271A; --bad:#E07E68; --bad-soft:#37221D;
    --bar:#000000; --bar-ink:#F1EEE9;
    --av1:#F1EEE9; --av2:#B59C7A; --av3:#8FA398;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131211; --surface:#1C1B19; --surface-2:#272522; --ink:#F1EEE9; --muted:#A29C92; --line:#34312D;
  --accent:#F1EEE9; --accent-ink:#131211;
  --sand:#C8AE88; --sand-soft:#2E2820; --sand-ink:#D8C19E;
  --ok:#72B38C; --ok-soft:#1D2C23; --warn:#D9A552; --warn-soft:#30271A; --bad:#E07E68; --bad-soft:#37221D;
  --bar:#000000; --bar-ink:#F1EEE9;
  --av1:#F1EEE9; --av2:#B59C7A; --av3:#8FA398;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
/* iPad: sem zoom com toque duplo nos botões +/−, sem "puxar" a página inteira, sem menus de toque longo nos botões */
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{overscroll-behavior:none}
button,.chip,.tab,.pill{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@supports (height:100dvh){ #app{height:100dvh} }
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;font-family:var(--display);font-weight:600;letter-spacing:-.015em}
h1{font-size:1.7rem}
h2{font-size:1.5rem}
h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-sm);background:var(--surface-2);font-weight:600;white-space:nowrap}
@media (hover:hover){ .btn:hover{filter:brightness(.97)} }
.btn-primary{background:var(--accent);color:var(--accent-ink)}
@media (hover:hover){ .btn-primary:hover{filter:none;opacity:.9} }
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn-danger{background:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-big{min-height:60px;font-size:1.05rem;padding:0 24px;border-radius:var(--r)}
.link{color:var(--ink);font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-decoration-color:var(--sand);text-underline-offset:4px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.lvl-ok{--lv:var(--ok);--lv-soft:var(--ok-soft)}
.lvl-warn{--lv:var(--warn);--lv-soft:var(--warn-soft)}
.lvl-bad{--lv:var(--bad);--lv-soft:var(--bad-soft)}
.pill.lvl-ok,.pill.lvl-warn,.pill.lvl-bad{background:var(--lv-soft);color:var(--lv)}
.pill-sand{background:var(--sand-soft);color:var(--sand-ink)}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}

/* Avatares */
.avatar{--av:var(--av1);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--av);color:var(--surface);font-weight:700;font-size:.85rem;flex:none}
.av-1{--av:var(--av1)} .av-2{--av:var(--av2)} .av-3{--av:var(--av3)}
.avatar.sm{width:26px;height:26px;font-size:.65rem}

/* Barra superior */
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.top-brand{display:flex;align-items:center;gap:10px;margin-right:8px}
.top-brand b{font-family:var(--display);font-weight:600;letter-spacing:-.01em}
.logo{width:30px;height:30px;flex:none;object-fit:contain}
.brand-word{font-family:var(--display);font-weight:600;letter-spacing:.2em;font-size:.95rem}
h1.brand-word{font-size:1.5rem;letter-spacing:.18em}
.brand-sub{font-size:.85rem;color:var(--muted);padding-left:10px;border-left:1px solid var(--line)}
.top-nav{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.tab{min-height:40px;padding:0 16px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab.is-on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.live-pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--bar);color:var(--bar-ink);font-weight:600;font-size:.9rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:pulse 1.6s infinite;flex:none}
@keyframes pulse{50%{opacity:.35}}
.top-note{margin-left:auto}
.me{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px 0 4px;border-radius:999px}
@media (hover:hover){ .me:hover{background:var(--surface-2)} }
.me-name{font-weight:600}

/* Páginas */
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:1180px;margin:0 auto;padding-inline:24px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
.wrap.narrow{max-width:880px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head > div{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head > div{min-width:0}
.empty{color:var(--muted);padding:14px 0}

/* Entrada */
.login{flex:1;overflow:auto;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:460px;display:flex;flex-direction:column;gap:22px}
.brand-lg{display:flex;align-items:center;gap:14px}
.brand-lg .logo{width:50px;height:50px}
.who{display:flex;flex-direction:column;gap:10px}
.who-b{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;min-height:72px}
@media (hover:hover){ .who-b:hover{border-color:var(--ink)} }
.who-b small{display:block;color:var(--muted);font-size:.85rem}
.pin{display:flex;flex-direction:column;align-items:center;gap:16px}
.pin .link{align-self:flex-start}
.pin-dots{display:flex;gap:14px}
.pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots span.on{background:var(--ink);border-color:var(--ink)}
.pin-dots.is-err span{border-color:var(--bad)}
.err{color:var(--bad);font-weight:600}
.pin-grid{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pin-k{height:76px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:1.6rem;font-weight:500;font-family:var(--display)}
.pin-k:active{background:var(--sand-soft)}
.demo-note{font-size:.85rem;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:16px}

/* Pacientes */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:0;width:100%;min-height:48px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface)}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.is-on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
@media (hover:hover){ .pcard:hover{border-color:var(--ink)} }
.pcard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.pcard-name{font-family:var(--display);font-size:1.12rem;font-weight:600}
.pcard-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.pnew{align-items:flex-start;justify-content:center;border-style:dashed;background:transparent;min-height:150px;gap:6px}
.pnew .plus{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.5rem;font-weight:500;line-height:1}

/* Ficha do paciente */
.p-head{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-start}
.p-head > div{min-width:0}
.p-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.p-actions{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.p-actions .row{display:flex;gap:8px}
.p-actions .row .btn{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:1.4rem;font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.span-2{grid-column:1/-1}
.plan-row{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,40%);gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.plan-row:first-child{border-top:0}
.plan-n{color:var(--muted);font-size:.85rem}
.plan-row > span:last-child{text-align:right}
.alts{font-size:.8rem;color:var(--muted)}
.uni{font-size:.68rem;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:5px;background:var(--sand-soft);color:var(--sand-ink);vertical-align:2px;margin-left:4px}
.from-last{white-space:nowrap;font-size:.68rem;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);vertical-align:2px;margin-left:4px;text-transform:uppercase}
.select{min-height:44px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);max-width:100%}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.legend i.dash{border-top-style:dashed;border-top-width:2px}
.hist-row{display:grid;grid-template-columns:92px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);text-align:left;width:100%}
@media (hover:hover){ .hist-row:hover{background:var(--surface-2)} }
.hist-who{display:flex;align-items:center;gap:8px;min-width:0}
.hist-who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td small{display:block;color:var(--muted);font-size:.78rem}
.tbl tr:last-child td{border-bottom:0}
.tbl tr[data-a]{cursor:pointer}
@media (hover:hover){ .tbl tr[data-a]:hover td{background:var(--surface-2)} }
.tbl tr.is-on td{background:var(--sand-soft)}
.tbl td.mid{vertical-align:middle}
.up{color:var(--ok);font-weight:700}
.down{color:var(--warn);font-weight:700}
.spark{width:96px;height:28px;display:block}
.star-mini{color:var(--sand);margin-left:4px}

/* Biblioteca de exercícios (página e janela de escolha) */
.lib-card{display:flex;flex-direction:column;gap:12px}
.lib-card .search,.modal .search{flex:none}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scrollx::-webkit-scrollbar{display:none}
.chip.sm{min-height:40px;padding:0 14px;font-size:.92rem;flex:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .select{flex:1;min-width:150px}
.lib-list{display:flex;flex-direction:column;gap:18px}
.lib-count{font-size:.85rem;color:var(--muted)}
.lib-sec{display:flex;flex-direction:column;min-width:0}
.lib-sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.lib-sec-h h3{font-size:1rem}
.lib-type{margin:12px 0 2px}
.lib-row{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);min-width:0}
.lib-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left;padding:9px 8px;min-height:56px;justify-content:center;border-radius:10px}
@media (hover:hover){ button.lib-main:hover{background:var(--surface-2)} }
.lib-name{font-weight:600;line-height:1.25}
.lib-meta{font-size:.8rem;color:var(--muted)}
.lib-last{font-size:.8rem;color:var(--sand-ink);font-weight:600}
.lib-side{flex:none;padding-right:6px}
.lib-hint{color:var(--muted);font-size:.9rem;padding:8px 0}
.star-b{width:44px;height:44px;flex:none;border-radius:50%;font-size:1.35rem;line-height:1;color:var(--muted);display:grid;place-items:center}
@media (hover:hover){ .star-b:hover{background:var(--surface-2)} }
.star-b.is-on{color:var(--sand)}
.star-t.is-on{border-color:var(--sand);color:var(--sand-ink);background:var(--sand-soft)}
.band{display:inline-flex;align-items:center;gap:6px}
.band i{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.band-dot{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:-3px;box-shadow:0 0 0 2px var(--surface),0 0 0 3px rgba(0,0,0,.15)}

/* Sessão */
.session{flex:1;min-height:0;display:grid;grid-template-columns:minmax(230px,290px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.live-bar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--bar);color:var(--bar-ink);flex-wrap:wrap}
.live-bar .who-live{display:flex;flex-direction:column;min-width:0}
.live-bar .who-live b{font-family:var(--display);font-weight:600;font-size:1.1rem}
.live-bar .who-live span{font-size:.85rem;opacity:.72}
.live-time{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:1.25rem;font-weight:600}
.btn-end{background:var(--bar-ink);color:var(--bar)}
.ex-list{overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:4px}
.ex-item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:var(--r-sm);min-height:56px}
@media (hover:hover){ .ex-item:hover{background:var(--surface-2)} }
.ex-item.is-cur{background:var(--sand-soft)}
.ex-st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700;border:2px solid var(--line);color:var(--muted)}
.ex-item.is-done .ex-st{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ex-item.is-part .ex-st{border-color:var(--sand);color:var(--sand-ink)}
.ex-item.is-skip .ex-st{border-style:dashed}
.ex-item.is-skip .ex-name{text-decoration:line-through;color:var(--muted)}
.ex-name{font-weight:600;line-height:1.2;min-width:0}
.ex-name small{display:block;font-weight:600;color:var(--sand-ink);font-size:.75rem}
.ex-count{font-size:.8rem;color:var(--muted)}
.ex-add{margin-top:6px;min-height:52px;border:1px dashed var(--line);border-radius:var(--r-sm);font-weight:600;color:var(--muted)}
.ex-main{overflow:auto;display:flex;flex-direction:column}
.exc{padding:20px 24px 0;display:flex;flex-direction:column;gap:16px;flex:1}
.exc-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.exc-head > div:first-child{min-width:0}
.last{margin-top:6px;color:var(--muted)}
.last b{color:var(--ink);font-weight:600}
.exc-actions{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.chip.is-on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip-alt{border-color:var(--sand);color:var(--sand-ink)}
.swapped{display:flex;flex-direction:column;gap:10px;padding:12px 16px;border-radius:var(--r);background:var(--sand-soft)}
.swapped-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sugg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;border-radius:var(--r);border:1px solid var(--ok);background:var(--ok-soft);flex-wrap:wrap;min-height:58px}
.sugg b{color:var(--ok)}
.sugg.is-down{border-color:var(--warn);background:var(--warn-soft)}
.sugg.is-down b{color:var(--warn)}
.sugg.is-hold{border-color:var(--line);background:var(--surface-2)}
.sides-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sides-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.side-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.side-h{display:flex;align-items:center;gap:8px;font-weight:700}
.side-h .pill{font-size:.72rem}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.set.is-done{border-color:var(--ok);background:var(--ok-soft)}
.set-n{width:38px;flex:none;text-align:center;font-weight:600;color:var(--muted);font-size:.7rem;line-height:1.1;text-transform:uppercase;letter-spacing:.05em}
.set-n b{display:block;color:var(--ink);font-size:1.3rem;font-family:var(--display);letter-spacing:0}
.stepper{flex:1;min-width:0;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;height:58px;border-radius:var(--r-sm);background:var(--surface-2)}
.st-b{height:100%;font-size:1.6rem;font-weight:500;border-radius:var(--r-sm)}
.st-b:active{background:var(--line)}
.st-v{text-align:center;line-height:1.05;min-width:0}
.st-v b{font-size:1.3rem;display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-v small{font-size:.72rem;color:var(--muted);font-weight:600}
.set-check{width:58px;height:58px;flex:none;border-radius:var(--r-sm);border:2px solid var(--line);font-size:1.4rem;font-weight:700;color:var(--muted);background:var(--surface)}
.set.is-done .set-check{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.set-tools{display:flex;gap:8px}
.set-tools .btn{min-height:40px;font-size:.9rem}
.pain-block{display:flex;flex-direction:column;gap:8px}
.pain-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pain-scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.pain-b{height:44px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.pain-b.is-on{background:var(--lv);border-color:var(--lv);color:var(--surface)}
.note{width:100%;min-height:52px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);resize:vertical}
.exc-foot{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;padding:14px 24px;background:var(--bg);border-top:1px solid var(--line);margin-top:8px}
.exc-foot .grow{flex:1}
.all-done{padding:12px 16px;border-radius:var(--r);background:var(--ok-soft);color:var(--ok);font-weight:600}
.empty-big{margin:auto;max-width:440px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:40px 0}

/* Relatório: folha com cores próprias de papel, iguais em tema claro e escuro */
.rep-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rep-bar .row{display:flex;gap:8px;flex-wrap:wrap}
.notice{padding:12px 16px;border-radius:var(--r);background:var(--sand-soft);color:var(--sand-ink);font-size:.92rem}
.sheet{--surface:#FFFFFF; --surface-2:#F3F1ED; --ink:#171615; --muted:#6D6860; --line:#E4DFD7; --accent:#171615;
  --sand:#A88C68; --sand-soft:#F2EBE0; --sand-ink:#7A6243;
  --ok:#3E7A55; --ok-soft:#E3EEE6; --warn:#9E6A14; --warn-soft:#F5EAD6; --bad:#B0452F; --bad-soft:#F6E1DB;
  background:var(--surface);color:var(--ink);width:100%;max-width:820px;margin:0 auto;padding:40px 44px;border-radius:4px;box-shadow:var(--shadow);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:24px;font-size:.93rem}
.sh-head{display:flex;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.sh-head > div{min-width:0}
.sh-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-brand .logo{width:24px;height:24px}
.sh-meta{display:grid;grid-template-columns:auto auto;gap:3px 14px;font-size:.85rem;align-content:start}
.sh-meta dt{color:var(--muted)}
.sh-meta dd{margin:0;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-size:1.45rem;font-weight:600;line-height:1.2}
.kpi small{color:var(--muted);font-size:.78rem}
.sh-sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.sh-sec h3{font-size:.95rem}
.sh-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.sh-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-top:16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.sign{min-width:220px;border-top:1px solid var(--ink);padding-top:6px;color:var(--ink)}
.report-raw{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;padding:12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface)}

/* Protocolos */
.proto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.proto-card{text-align:left;display:flex;flex-direction:column;gap:6px}
@media (hover:hover){ .proto-card:hover{border-color:var(--ink)} }
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.input{min-height:48px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);width:100%}
.pe-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.pe-steps{display:flex;gap:8px;flex-wrap:wrap}
.pe-steps .stepper{flex:none;width:170px;height:50px;grid-template-columns:46px minmax(0,1fr) 46px}
.pe-steps .st-v b{font-size:1.05rem}
.pe-ctrl{display:flex;gap:4px}
.icon-b{width:44px;height:44px;border-radius:var(--r-sm);background:var(--surface-2);font-weight:700}
.t-row{display:grid;grid-template-columns:minmax(0,1fr) 90px auto auto 44px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.t-row .input{min-height:44px}
.cbx{display:flex;gap:8px;align-items:center;min-height:44px;font-size:.9rem;white-space:nowrap}
.cbx input{width:20px;height:20px;accent-color:var(--ink)}

/* Janelas */
.modal-back{position:fixed;inset:0;background:rgba(10,10,9,.5);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--bg);border-radius:18px;padding:24px;width:100%;max-width:560px;max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.modal.wide{max-width:900px;height:calc(100% - 32px);max-height:940px;overflow:hidden;padding:20px 20px 0;gap:12px}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-top > div{min-width:0}
.pick-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:18px;padding-bottom:20px;-webkit-overflow-scrolling:touch}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal-actions.col{flex-direction:column;align-items:stretch}
.warn-box{padding:12px 14px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-weight:600}
.cb-list{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px;background:var(--surface)}
.cb-list label{display:flex;gap:10px;align-items:center;min-height:40px;padding:0 6px}
.cb-list input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.test-in{display:grid;grid-template-columns:minmax(0,1fr) 120px 120px;gap:10px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.test-in .input{min-height:48px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:.95rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600}

#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;z-index:20;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

.top-note{min-height:40px;padding:0 14px;font-size:.92rem}
.btn-note{background:rgba(255,255,255,.12);color:var(--bar-ink);min-height:44px}
@media (hover:hover){ .btn-note:hover{background:rgba(255,255,255,.2);filter:none} }

/* Notas */
.notes-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notes-bar .search{flex:1 1 260px}
.notes-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.notes-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.notes-side{position:sticky;top:0}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-h b{font-family:var(--display);font-weight:600;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-dow{font-size:.68rem;font-weight:700;text-align:center;color:var(--muted);padding:4px 0;text-transform:uppercase}
.cal-d{height:42px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:.92rem}
@media (hover:hover){ .cal-d:hover{background:var(--surface-2)} }
.cal-d.out{color:var(--muted);opacity:.45}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--sand)}
.cal-d.sel{background:var(--accent);color:var(--accent-ink)}
.cal-d i{width:6px;height:6px;border-radius:50%;background:var(--sand)}
.cal-d.sel i{background:var(--accent-ink)}
.cal-d i.none{visibility:hidden}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.day-h h2{font-size:1.3rem}
.day-h .row{display:flex;gap:6px}
.note-day{margin-top:8px}
.note-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.note-card.is-quick{border-left:4px solid var(--sand)}
.note-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;min-height:32px}
.note-time{font-weight:700}
.note-pt{font-weight:700;text-decoration:underline;text-decoration-color:var(--sand);text-underline-offset:3px}
.note-src{color:var(--muted)}
button.note-src{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.note-by{display:inline-flex;align-items:center;gap:6px;color:var(--muted);margin-left:auto}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.note-text mark{background:var(--sand-soft);color:inherit;border-radius:3px;padding:0 1px}
.mini-b{min-height:32px;padding:0 10px;border-radius:8px;font-size:.82rem;font-weight:600;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
@media (hover:hover){ .mini-b:hover{color:var(--ink)} }
.pt-list{display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 300px);overflow:auto}
.pt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:10px 12px;border-radius:var(--r-sm);min-height:56px;width:100%}
@media (hover:hover){ .pt-row:hover{background:var(--surface-2)} }
.pt-row.is-on{background:var(--sand-soft)}
.pt-row b{display:block}
.pt-row small{color:var(--muted)}
.pt-pick{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px;background:var(--surface)}
.pt-chosen{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r-sm);background:var(--sand-soft);flex-wrap:wrap}
.pt-chosen b{font-family:var(--display);font-weight:600}
.note-input{min-height:170px;font-size:1.05rem;line-height:1.5}

.builder{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px)}
.b-main{overflow:auto;padding:20px 24px 48px;display:flex;flex-direction:column;gap:12px;min-width:0}
.b-side{overflow:auto;border-left:1px solid var(--line);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.b-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.b-head > div{min-width:0}
.b-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.b-top{display:flex;align-items:center;gap:10px}
.b-n{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none}
.b-name{flex:1;min-width:0;font-weight:600;line-height:1.25}
.b-name small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.b-ctrl{display:flex;gap:4px;flex:none}
.b-ctrl .icon-b{width:38px;height:38px}
.b-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.b-side-lbl{width:22px;font-weight:700;color:var(--muted);font-size:.85rem;flex:none}
.mini-st{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;height:46px;flex:1 1 130px;max-width:200px;border-radius:10px;background:var(--surface-2)}
.mini-st .st-b{font-size:1.3rem}
.mini-st .st-v b{font-size:1.05rem}
.mini-st .st-v small{font-size:.66rem}
.mini-st .band-dot{width:18px;height:18px;vertical-align:-3px}
.b-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.sg-chip{min-height:34px;padding:0 12px;border-radius:999px;font-size:.85rem;font-weight:700;border:1px solid var(--ok);color:var(--ok);background:var(--ok-soft)}
.sg-chip.down{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.sg-hold{font-weight:600;color:var(--warn)}
.b-add{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:9px 6px;border-top:1px solid var(--line);min-height:56px;border-radius:8px}
@media (hover:hover){ .b-add:hover{background:var(--surface-2)} }
.b-plus{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;flex:none;color:var(--muted);font-size:1.1rem}
.b-add.is-in .b-plus{background:var(--ok);border-color:var(--ok);color:#fff}
.b-add > span:last-child{min-width:0}
.b-side .seg{display:grid;grid-template-columns:1fr 1fr}
.b-side .seg button{padding:0 8px;font-size:.92rem}
.b-all{width:100%}
.same-warn{padding:10px 14px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:.92rem}
.plan-note{padding:10px 12px;border-radius:var(--r-sm);background:var(--sand-soft);color:var(--sand-ink);font-size:.88rem;margin-bottom:6px}
.plan-note b{display:block;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase}

@media (max-width: 1000px){
  .stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (max-width: 700px){
  .builder{grid-template-columns:minmax(0,1fr);overflow:auto;display:block}
  .b-main,.b-side{overflow:visible}
  .b-side{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width: 900px){
  .notes-layout{grid-template-columns:minmax(0,1fr)}
  .notes-side{position:static}
  .pt-list{max-height:260px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .sides-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 700px){
  .top{padding:8px 16px;gap:10px}
  .top-brand .brand-sub,.me-name{display:none}
  .tab{padding:0 10px;flex:1 0 auto}
  .top-nav{order:3;width:100%;overflow-x:auto;scrollbar-width:none}
  .top-note span{display:none}
  .live-bar > .dot{display:none}
  .wrap{padding-inline:16px}
  .session{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  .ex-list{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line)}
  .ex-item{min-width:190px}
  .ex-list{align-items:flex-start}
  .ex-list .plan-note{min-width:240px;max-width:280px;margin-bottom:0;align-self:stretch;overflow:auto}
  .ex-list .ex-item,.ex-list .ex-add{align-self:stretch}
  .ex-add{min-width:120px;margin-top:0}
  .exc{padding:16px 16px 0}
  .exc-foot{padding:12px 16px}
  .stepper{grid-template-columns:42px minmax(0,1fr) 42px}
  .set{gap:6px;padding:6px}
  .set-n{width:30px}
  .set-check{width:50px}
  .pain-scale{gap:3px}
  .pain-b{font-size:.85rem}
  .hist-row{grid-template-columns:64px minmax(0,1fr) auto}
  .hide-sm{display:none}
  .pe-row{grid-template-columns:minmax(0,1fr)}
  .pe-row .plan-n{display:none}
  .t-row{grid-template-columns:minmax(0,1fr) 80px 44px}
  .t-row .cbx{grid-column:1/-1}
  .grid-3{grid-template-columns:minmax(0,1fr)}
  .grid-4{grid-template-columns:1fr 1fr}
  .test-in{grid-template-columns:1fr 1fr}
  .test-in > span{grid-column:1/-1}
  .btn-big{font-size:1rem;padding:0 16px}
  .sheet{padding:22px 18px}
  .kpis,.sh-2{grid-template-columns:minmax(0,1fr)}
  .modal.wide{padding:16px 16px 0}
}
/* ---------- iPad ---------- */
/* Resposta ao toque (não há hover) */
.btn,.icon-b,.chip,.tab,.pain-b,.set-check,.st-b,.mini-b,.pin-k,.b-add,.demo-btn{transition:transform .08s ease}
.btn:active,.icon-b:active,.chip:active,.tab:active,.pain-b:active,.set-check:active{transform:scale(.96)}
.b-add:active,button.lib-main:active,.ex-item:active,.pt-row:active,.cal-d:active,.hist-row:active{background:var(--surface-2)}
.pcard:active,.proto-card:active,.who-b:active{border-color:var(--ink)}
/* Zonas seguras: barra de cima e rodapés não ficam por baixo da barra do iPad em ecrã inteiro */
.top{padding-top:calc(10px + env(safe-area-inset-top, 0px));padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
.exc-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
.wrap{padding-bottom:calc(48px + env(safe-area-inset-bottom, 0px))}
.b-main,.b-side{padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px))}
@media (min-width:701px){ .ex-list{padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px))} }
@media (max-width:700px){ .top{padding:calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px))} }
/* iPad ao alto (744 a 1000 px): tudo numa linha em cima, duas colunas no treino e na sessão */
@media (min-width:701px) and (max-width:1000px){
  .top{gap:10px}
  .top-brand .brand-sub,.me-name{display:none}
  .tab{padding:0 12px}
  .session{grid-template-columns:minmax(200px,232px) minmax(0,1fr)}
  .builder{grid-template-columns:minmax(0,1fr) 300px}
  .b-main{padding:16px 16px 48px}
  .b-side{padding:14px 12px}
  .b-side .seg button{white-space:nowrap;font-size:.86rem;padding:0 4px}
  .mini-st{flex-basis:108px;max-width:172px}
  .exc{padding-inline:18px}
  .exc-foot{padding-inline:18px}
}
/* Miniatura animada do exercício (para reconhecer ao escolher) */
.ex-thumb{display:block;width:72px;flex:none;border-radius:9px;overflow:hidden;background:var(--surface-2)}
.ex-thumb svg{display:block;width:100%;aspect-ratio:240/190}
.ex-thumb .d-floor{stroke:var(--line);stroke-width:2}

function seed(){

  }

    return {id:r[0], name:r[1], desc:r[2], items:r[3].map(function(i){ return Object.assign({ex:i[0]}, rxOf(i[0], i[1], i[2], i[3])); }),
      tests:r[4].map(function(t){ return Object.assign({better:'up'}, t); })};
  });

    var pr = pm[P.proto], first = null, dates = [], ths = [];
    var plan = pr.items.map(function(it){ return {it:it, added:false}; })
      .concat((P.extra||[]).map(function(x){ return {it:Object.assign({ex:x[0]}, rxOf(x[0], x[1], x[2], x[3])), added:true}; }));
    for(var i=0;i<P.n;i++){
      var back = Math.round(P.last + (P.n-1-i)*3.5);
      var d = new Date(today); d.setDate(d.getDate()-back); d.setHours(9+Math.floor(rnd()*10), rnd()<.5?0:30, 0, 0);
      if(!first) first = d;
      var painEnd = clamp(Math.round(P.p0-(P.p0-P.p1)*(P.n>1?i/(P.n-1):1)+(rnd()-.5)*1.6),0,10);
      var sw = (P.swaps && P.swaps[i]) || {};
      var entries = plan.map(function(pl){
        var it = pl.it, exId = sw[it.ex] || it.ex, ex = em[exId], rx = exId===it.ex ? it : ex.def;
        var load = rx.load||0; for(var q=0;q<Math.floor(i/2) && load>0;q++) load = stepLoad(load,1);
        var band = ex.r==='band' ? clamp((rx.band!=null?rx.band:ex.def.band)+Math.floor(i/3),0,BANDS.length-1) : null;
        var main = rx[ex.v]!=null ? rx[ex.v] : ex.def[ex.v];
        if(ex.v==='secs') main += 5*Math.floor(i/3);
        else if(ex.v==='reps' && !ex.r) main += Math.floor(i/2);
        var sides = ex.uni ? ['E','D'] : [''], sets = [];
        sides.forEach(function(sd){
          // o lado lesionado começa abaixo e vai-se aproximando do lado são
          var gap = ex.uni && P.side===sd ? Math.max(0, 2-Math.floor(i/3)) : 0;
          var l = load; if(ex.r==='kg') for(var g=0; g<gap; g++) l = Math.max(load>0?1:0, stepLoad(l,-1));
          var b = band!=null ? Math.max(0, band-gap) : null;
          var mn = ex.r ? main : Math.max(VOL[ex.v].step, main-VOL[ex.v].prog*gap);
          for(var k=0;k<rx.sets;k++){
            var s = {done:true, load:ex.r==='kg'?l:0};
            s[ex.v] = ex.v==='reps' && k===rx.sets-1 && rnd()<.2 ? mn-2 : mn;
            if(b!=null) s.band = b;
            if(sd) s.side = sd;
            sets.push(s);
          }
        });
        var pain = P.epain && P.epain[exId]!=null ? P.epain[exId] : rnd()<.45 ? clamp(painEnd+Math.round((rnd()-.5)*2),0,10) : null;
        return {ex:exId, planned:it.ex, swappedFrom:exId!==it.ex?it.ex:null, reason:exId!==it.ex?(sw.reason||'Não gosta'):null, added:pl.added,
          skipped:false, sides:ex.uni?'ED':'', sets:sets, pain:pain, note:''};
      });
      var th = P.pattern[i%P.pattern.length];
      dates.push(d.toISOString()); ths.push(th);
      sessions.push({id:P.id+'s'+i, patientId:P.id, therapistId:th, proto:pr.id,
        date:d.toISOString(), durationMin:45+Math.floor(rnd()*15), painEnd:painEnd, note:(P.notes&&P.notes[i])||'', entries:entries});
    }
    if(P.tests) P.tests.at.forEach(function(si, j){
      var vals = pr.tests.map(function(t){
        var src = P.tests[t.id]; if(!src) return null;
        var v = {tid:t.id, name:t.name, unit:t.unit, uni:t.uni, better:t.better};
        if(t.uni){ var o = P.side==='E'?'D':'E'; v[P.side] = src.a[j]; v[o] = src.h[j]; } else v.v = src.v[j];

    });
    patients.push({id:P.id, code:P.code, alias:P.alias, proto:P.proto, side:P.side, goal:P.goal, stars:(P.stars||[]).slice(), since:(first||today).toISOString()});
  });
  return {v:3, me:null, live:null, therapists:THS.map(function(t){return Object.assign({},t);}), exercises:exercises, protocols:protocols,
    patients:patients, sessions:sessions, tests:tests, notes:seedNotes(patients)};

    var vals={};
    (ex.uni?['E','D']:['']).forEach(function(sd){
      var ss=doneSets(sd?sideSets(lp.e.sets,sd):lp.e.sets); if(!ss.length) return;
      var v={}; v[ex.v]=bestOf(ss,ex.v); if(ex.r==='kg') v.load=bestOf(ss,'load')||0;
      if(ex.r==='band'){ var bb=bestOf(ss,'band'); v.band=bb!=null?bb:it.band; }
      vals[sd]=v; it.sets=Math.max(1, ss.length);
    });
    var k=Object.keys(vals);
    if(k.length){ Object.assign(it, vals[k[0]]); if(vals.E && vals.D && !sameVals(vals.E, vals.D)) it.per={E:vals.E, D:vals.D}; }
    it.sg=suggest(ex, it, lp, {sides:ex.uni?'ED':'', sets:itemSets(ex, it)}, PT(pid).side);
  }
  return it;
}
function applyItemSugg(it){
  var ex=EX(it.ex), sg=it.sg; if(!sg || !sg.dir) return;
  Object.keys(sg.vals).forEach(function(sd){ var x=sg.vals[sd];
    if(sd){ if(!it.per) it.per={E:itemVals(ex,it), D:itemVals(ex,it)}; it.per[sd][x.f]=x.v; } else it[x.f]=x.v; });
  if(it.per && sameVals(it.per.E, it.per.D)){ Object.assign(it, it.per.E); it.per=null; }
  it.sgDone=true;
}
function fmtItem(ex, it){
  if(!it.per) return fmtRx(ex, it);
  return ['E','D'].map(function(sd){ return sd+' '+fmtRx(ex, Object.assign({sets:it.sets}, it.per[sd])); }).join(' | ');
}
// Assinatura do treino, para avisar quando fica igual ao anterior
function planSig(ex, sets){ return ex.id+':'+sets.map(function(s){ return (s.side||'')+s[ex.v]+'/'+(s.load||0)+'/'+(s.band!=null?s.band:''); }).join(','); }
function sameAsLast(p){
  var last=sessionsOf(p.id)[0]; if(!last || !p.plan || !p.plan.items.length) return false;
  var a=last.entries.filter(function(e){ return !e.skipped && doneSets(e.sets).length && EX(e.ex); }).map(function(e){ return planSig(EX(e.ex), doneSets(e.sets)); }).join(';');
  var b=p.plan.items.map(function(it){ return planSig(EX(it.ex), itemSets(EX(it.ex), it)); }).join(';');
  return a===b;
}
function hasPlan(p){ return !!(p.plan && p.plan.items.length); }
// Pré-preenche as séries de um lado com o que o paciente fez da última vez (ou com a prescrição)
function makeSets(ex, rx, lp, sd){
  var src = lp ? doneSets(sideSets(lp.e.sets, sd)) : [];
  if(lp && !src.length && sd) src = doneSets(lp.e.sets);
  var main = src.length && bestOf(src, ex.v)!=null ? bestOf(src, ex.v) : rxMain(ex, rx);
  var load = ex.r==='kg' ? (src.length ? bestOf(src,'load')||0 : (rx.load||0)) : 0;
  var band = ex.r==='band' ? (src.length && bestOf(src,'band')!=null ? bestOf(src,'band') : rxBand(ex, rx)) : null;
  var out = [];
  for(var k=0;k<rx.sets;k++){ var s={done:false, load:load}; s[ex.v]=main; if(band!=null) s.band=band; if(sd) s.side=sd; out.push(s); }
  return out;
}
function buildEntry(exId, rx, pid, added, fromPlan){
  var ex = EX(exId), lp = lastPerf(pid, exId);
  var sides = ex.uni ? (fromPlan ? 'ED' : (lp && lp.e.sides) || 'ED') : '';
  var sets = [];
  if(fromPlan) sets = itemSets(ex, rx);
  else (sides ? sides.split('') : ['']).forEach(function(sd){ sets = sets.concat(makeSets(ex, rx, lp, sd)); });
  var e = {ex:exId, planned:exId, rx:Object.assign({},rx), swappedFrom:null, origRx:null, reason:null, skipped:false, added:!!added,
    sides:sides, sets:sets, pain:null, note:'', suggDone:false,
    last: lp ? {date:lp.s.date, t:lp.s.therapistId, txt:fmtSets(ex, lp.e.sets), pain:lp.e.pain, lsi:lsiEntry(ex, lp.e.sets, PT(pid).side)} : null};
  // no treino preparado a progressão já foi decidida pelo fisioterapeuta
  e.fromPlan = !!fromPlan;
  e.sugg = fromPlan ? null : suggest(ex, rx, lp, e, PT(pid).side);
  return e;
}
/* Progressão guiada pela dor da última vez (modelo de monitorização da dor):
   dor até 3 e tudo feito como previsto → subir; dor 4 ou 5 → manter; dor 6 ou mais → baixar (só o lado lesionado). */
function suggest(ex, rx, lp, e, pside){
  if(!lp) return null;
  var d = doneSets(lp.e.sets), pain = lp.e.pain, dir;
  if(!d.length) return null;
  if(pain!=null && pain>=6) dir = -1;
  else if(pain!=null && pain>=4) return {dir:0, txt:'Dor '+pain+'/10 da última vez. Manter a carga e voltar a avaliar.'};
  else {
    if(d.length<lp.e.sets.length) return null;
    if(ex.r && d.some(function(s){ return (s[ex.v]||0)<rxMain(ex, rx); })) return null;
    dir = 1;
  }
  var vals = {}, parts = [];
  sidesOf(e).forEach(function(sd){
    if(dir<0 && sd && pside && sidesOf(e).indexOf(pside)>=0 && sd!==pside) return;
    var s0 = sideSets(e.sets, sd)[0]; if(!s0) return;
    var f, v;
    if(ex.r==='kg' && s0.load>0){ f='load'; v=stepLoad(s0.load, dir); }
    else if(ex.r==='band' && s0.band!=null && (dir>0 ? s0.band<BANDS.length-1 : s0.band>0)){ f='band'; v=s0.band+dir; }
    else { f=ex.v; v=Math.max(VOL[ex.v].step, (s0[ex.v]||0)+dir*VOL[ex.v].prog); }
    vals[sd] = {f:f, v:v};
    parts.push((sd?sd+' ':'')+fmtVal(f, v));
  });
  if(!parts.length) return null;
  var lead = dir>0 ? 'Fez tudo como previsto da última vez'+(pain!=null?' (dor '+pain+'/10)':'')+'. Sugestão: ' : 'Dor '+pain+'/10 da última vez. Sugestão: ';
  return {dir:dir, vals:vals, lead:lead, txt:(dir>0?'subir para ':'baixar para ')+parts.join(' · ')};
}
function entryState(e){
  var n = doneSets(e.sets).length;
  if(e.skipped) return 'skip';
  if(n===e.sets.length && n>0) return 'done';
  return n ? 'part' : 'todo';
}
function advance(){
  var L = D.live, n = L.entries.length;
  for(var k=1;k<=n;k++){ var i=(L.cur+k)%n; var st=entryState(L.entries[i]); if(st==='todo'||st==='part'){ L.cur=i; break; } }
  ui.swapOpen=false; save(); render();
}
function sessionNumber(s){ var asc=sessionsOf(s.patientId).slice().reverse(); return asc.findIndex(function(x){return x.id===s.id;})+1; }

var wake = null;
function requestWake(){ try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){wake=w;}).catch(function(){}); }catch(e){} }
function releaseWake(){ try{ if(wake) wake.release(); }catch(e){} wake=null; }

/* ---------- Evolução ---------- */
function deltaInfo(ex, e, s){
  var lp = lastPerf(s.patientId, e.ex, s.date); if(!lp) return {txt:'1.ª vez', cls:''};
  var f = metricFor(ex, e.sets.concat(lp.e.sets)), sides = sidesOf(e), parts = [], up = 0, down = 0;
  sides.forEach(function(sd){
    var a = bestOf(sideSets(e.sets,sd),f), b = bestOf(sideSets(lp.e.sets,sd),f);
    if(a==null || b==null) return;
    var diff = Math.round((a-b)*10)/10;
    if(diff>0) up++; if(diff<0) down++;
    parts.push((sd?sd+' ':'')+(diff ? fmtDiff(f, diff) : '='));
  });
  if(!parts.length) return {txt:'—', cls:''};
  var txt = sides[0]==='' ? (up?'↑ '+parts[0]:down?'↓ '+parts[0]:'igual') : parts.join(' · ');
  return {txt:txt, cls: down?'down':up?'up':''};
}
// Mudança entre dois valores: em percentagem, ou em níveis no caso dos elásticos
function change(f, a, b){
  if(a==null || b==null) return {chg:'', cls:''};
  var d = Math.round((b-a)*10)/10, cls = d>0?'up':d<0?'down':'';
  if(!d) return {chg:'=', cls:''};
  if(f==='band' || !(a>0)) return {chg:fmtDiff(f, d), cls:cls};
  var pct = Math.round(d/a*100);
  return {chg:(pct>0?'+':'')+pct+' %', cls:cls, pct:pct};
}
// Da primeira vez que fez o exercício até esta sessão. Nos unilaterais conta o lado lesionado.
function sinceFirst(ex, e, s, pside){
  var fp = firstPerf(s.patientId, e.ex, s.date); if(!fp) return null;
  var f = metricFor(ex, e.sets.concat(fp.e.sets));
  var sd = e.sets.some(function(x){return x.side;}) && pside ? pside : null;
  var a = bestOf(sd ? sideSets(fp.e.sets, sd) : fp.e.sets, f), b = bestOf(sd ? sideSets(e.sets, sd) : e.sets, f);
  if(a==null || b==null) return null;
  var c = change(f, a, b);
  return {chg:c.chg==='='?'':c.chg, cls:c.cls, from:fmtVal(f,a)+' → '+fmtVal(f,b)+(sd?' ('+sd+')':'')};
}
// Linha de progressão de um exercício: melhor valor de cada sessão, primeira e última vez
function progRow(p, ex, rows){
  var all=[].concat.apply([], rows.map(function(r){return r.e.sets;})), f=metricFor(ex, all);
  var sd = all.some(function(s){return s.side;}) && p.side ? p.side : null;
  var vals = rows.map(function(r){ return bestOf(sd ? sideSets(r.e.sets, sd) : r.e.sets, f); });
  var nn = vals.filter(function(v){return v!=null;}), a = nn[0], b = nn[nn.length-1];
  var c = rows.length>1 ? change(f, a, b) : {chg:'', cls:''}, last = rows[rows.length-1];
  return {ex:ex, f:f, sd:sd, n:rows.length, vals:vals, a:a, b:b, chg:c.chg, cls:c.cls,
    firstDate:rows[0].s.date, lastDate:last.s.date, firstTxt:fmtSets(ex, rows[0].e.sets), lastTxt:fmtSets(ex, last.e.sets),
    lastPain:last.e.pain, lsi:lsiEntry(ex, last.e.sets, p.side)};
}
function progRows(p){
  var map={}, order=[];
  sessionsOf(p.id).slice().reverse().forEach(function(s){ s.entries.forEach(function(e){
    if(e.skipped || !doneSets(e.sets).length || !EX(e.ex)) return;
    if(!map[e.ex]){ map[e.ex]=[]; order.push(e.ex); } map[e.ex].push({s:s, e:e}); }); });
  return order.map(function(id){ return progRow(p, EX(id), map[id]); }).sort(function(a,b){ return b.lastDate<a.lastDate?-1:b.lastDate>a.lastDate?1:a.ex.name.localeCompare(b.ex.name,'pt'); });
}
function testTable(p, upto){
  var recs = testsOf(p.id, upto); if(!recs.length) return null;
  var by = {}, order = [];
  recs.forEach(function(r){ r.vals.forEach(function(v){ if(!by[v.name]){ by[v.name]=[]; order.push(v.name); } by[v.name].push({date:r.date, v:v}); }); });
  return order.map(function(name){
    var list = by[name], a = list[0], b = list[list.length-1], m = b.v;
    function main(v){ return !m.uni ? v.v : p.side ? v[p.side] : null; }
    function cell(x){
      var v = x.v, h;
      if(!m.uni) h = fu(v.v, m.unit);
      else if(p.side){ var o = p.side==='E'?'D':'E'; h = fu(v[p.side], m.unit)+'<small>lado são '+fu(v[o], m.unit)+'</small>'; }
      else h = 'E '+fu(v.E, m.unit)+' · D '+fu(v.D, m.unit);
      return h+'<small>'+fmtShort(x.date)+'</small>';
    }
    var chg = '', cls = '';
    if(list.length>1){
      var x0 = main(a.v), x1 = main(b.v);
      if(x0!=null && x1!=null){ var d = Math.round((x1-x0)*10)/10; chg = (d>0?'+':d<0?'−':'')+fu(Math.abs(d), m.unit);
        cls = d===0 ? '' : (d>0) === (m.better!=='down') ? 'up' : 'down'; }
    }
    var l0 = m.uni ? ratio(a.v.E, a.v.D, p.side) : null, l1 = m.uni ? ratio(b.v.E, b.v.D, p.side) : null;
    return {name:name, unit:m.unit, uni:m.uni, better:m.better, n:list.length, first:cell(a), last:list.length>1?cell(b):'—', chg:chg, cls:cls, l0:l0, l1:l1,
      v0:main(a.v), v1:main(b.v)};
  });
}
function testTableHtml(rows){
  return '<div class="table-wrap"><table class="tbl"><thead><tr><th>Teste</th><th>Primeira</th><th>Última</th><th>Variação</th><th>Simetria</th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr><td><b>'+esc(r.name)+'</b>'+(r.better==='down'?'<small>quanto menor, melhor</small>':'')+'</td><td>'+r.first+'</td><td>'+r.last+'</td>'+
        '<td class="'+r.cls+'">'+(r.chg||'—')+'</td><td style="white-space:nowrap">'+(r.uni ? (r.n>1 && r.l0!=null ? '<span class="small muted">'+r.l0+' % →</span> ' : '')+lsiPill(r.l1) : '<span class="muted">—</span>')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
// Número-chave para o topo do relatório: simetria de um teste, senão um teste, senão a carga de um exercício
function keyFigure(p, s){
  var rows = testTable(p, dayEnd(s.date)) || [];
  // o teste com a simetria mais baixa é o que mais importa mostrar
  var u = rows.filter(function(r){ return r.uni && r.l1!=null; }).sort(function(a,b){ return a.l1-b.l1; })[0];
  if(u) return {v:(u.n>1 && u.l0!=null ? u.l0+' → ' : '')+u.l1+' %', lbl:'Simetria · '+u.name, sub:'lado lesionado face ao são · referência ≥ 90 %', lv:lsiLvl(u.l1)};
  var t = rows.find(function(r){ return r.n>1 && r.v0!=null; });
  if(t) return {v:num(t.v0)+' → '+fu(t.v1, t.unit), lbl:t.name, sub:'primeira → última medição'};
  for(var i=0;i<s.entries.length;i++){
    var e=s.entries[i], ex=EX(e.ex); if(!ex || e.skipped) continue;
    var sf = sinceFirst(ex, e, s, p.side);
    if(sf && sf.chg) return {v:sf.from, lbl:ex.name, sub:'desde a primeira sessão ('+sf.chg+')'};
  }
  return null;
}

var DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
var MESES_L = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dkey(d){ d=new Date(d); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromKey(k){ var a=k.split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }
function fmtTime(iso){ var d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function dayLabel(k){
  var d=fromKey(k), n=Math.round((dayStart(new Date())-d)/864e5);
  var full=DIAS[d.getDay()]+', '+d.getDate()+' de '+MESES_L[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' de '+d.getFullYear():'');
  return n===0 ? 'Hoje · '+full : n===1 ? 'Ontem · '+full : full.charAt(0).toUpperCase()+full.slice(1);
}
// Todas as notas num só sítio: as rápidas, a nota de fim de sessão e as notas de cada exercício
function allNotes(){
  var out = D.notes.map(function(n){ return {kind:'quick', id:n.id, patientId:n.patientId, therapistId:n.therapistId, date:n.date, text:n.text, sessionId:n.sessionId}; });
  D.sessions.forEach(function(s){
    if(s.note) out.push({kind:'session', id:'sn'+s.id, patientId:s.patientId, therapistId:s.therapistId, date:new Date(new Date(s.date).getTime()+s.durationMin*60000).toISOString(), text:s.note, sessionId:s.id});
    s.entries.forEach(function(e, i){ if(e.note){ var ex=EX(e.ex);
      out.push({kind:'exercise', id:'en'+s.id+'-'+i, patientId:s.patientId, therapistId:s.therapistId, date:new Date(new Date(s.date).getTime()+(i+1)*5*60000).toISOString(), text:e.note, sessionId:s.id, exName:ex?ex.name:''}); } });
  });
  return out.filter(function(n){ return PT(n.patientId); }).sort(function(a,b){ return b.date<a.date?-1:b.date>a.date?1:0; });
}
function notesFiltered(){
  var o=ui.notes, words=norm(o.q).split(/\s+/).filter(Boolean);
  return allNotes().filter(function(n){
    if(o.kind==='quick' && n.kind!=='quick') return false;
    if(o.kind==='session' && n.kind==='quick') return false;
    if(!words.length) return true;
    var hay=norm(n.text+' '+PT(n.patientId).alias+' '+(n.exName||''));
    return words.every(function(w){ return hay.indexOf(w)>=0; });
  });
}
// Realça as palavras procuradas, sem ligar a acentos nem maiúsculas
function hl(text, q){
  var words=norm(q).split(/\s+/).filter(Boolean), chars=Array.from(text);
  if(!words.length) return esc(text);
  var n=chars.map(function(c){ return norm(c); });
  if(n.some(function(c){ return c.length!==1; })) return esc(text);
  var flat=n.join(''), on=chars.map(function(){return false;});
  words.forEach(function(w){ var i=flat.indexOf(w); while(i>=0){ for(var k=i;k<i+w.length;k++) on[k]=true; i=flat.indexOf(w,i+1); } });
  var out='', open=false;
  chars.forEach(function(c,i){ if(on[i]&&!open){ out+='<mark>'; open=true; } if(!on[i]&&open){ out+='</mark>'; open=false; } out+=esc(c); });
  return out+(open?'</mark>':'');
}
function noteSrc(n){
  if(n.kind==='quick'){ var ss=n.sessionId?SS(n.sessionId):null; return ss ? 'Nota rápida durante a sessão n.º '+sessionNumber(ss) : 'Nota rápida'; }
  var s=SS(n.sessionId), lbl=(n.kind==='session'?'Nota de fim da sessão n.º ':'Sessão n.º ')+(s?sessionNumber(s):'?')+(n.exName?' · '+n.exName:'');
  return lbl;
}
function noteCard(n, o){
  var t=TH(n.therapistId), p=PT(n.patientId), mine=n.kind==='quick' && (n.therapistId===D.me || me().admin);
  var src = n.kind==='quick' ? '<span class="note-src">'+esc(noteSrc(n))+'</span>'
    : '<button class="note-src" data-a="openReport" data-id="'+n.sessionId+'">'+esc(noteSrc(n))+'</button>';
  return '<article class="note-card'+(n.kind==='quick'?' is-quick':'')+'"><div class="note-top">'+
    '<span class="note-time">'+(o.date?fmtShort(n.date)+' · ':'')+fmtTime(n.date)+'</span>'+
    (o.patient?'<button class="note-pt" data-a="notesOfPatient" data-id="'+p.id+'">'+esc(p.alias)+'</button>':'')+src+
    '<span class="note-by">'+(t?avatar(t,true)+esc(first(t.name)):'')+(mine?'<button class="mini-b" data-a="noteEdit" data-id="'+n.id+'">Editar</button>':'')+'</span></div>'+
    '<p class="note-text">'+hl(n.text, o.q||'')+'</p></article>';
}
// Lista agrupada por dia
function noteTimeline(list, o){
  var out='', lastK='';
  list.forEach(function(n){ var k=dkey(n.date); if(k!==lastK){ out+='<p class="label note-day">'+esc(dayLabel(k))+'</p>'; lastK=k; } out+=noteCard(n, o); });

function logo(){ return '<img class="logo" src="'+LOGO+'" alt="">'; }
function avatar(t, sm){ return '<span class="avatar av-'+t.av+(sm?' sm':'')+'" title="'+esc(t.name)+'">'+esc(t.ini)+'</span>'; }
function painScale(v, action){
  var h='<div class="pain-scale" role="group" aria-label="Escala de dor de 0 a 10">';
  for(var i=0;i<=10;i++) h+='<button class="pain-b lvl-'+lvl(i)+(v===i?' is-on':'')+'" data-a="'+action+'" data-v="'+i+'" aria-pressed="'+(v===i)+'">'+i+'</button>';
  return h+'</div>';
}
function stepper(label, val, action, attrs){
  return '<div class="stepper"><button class="st-b" data-a="'+action+'" '+attrs+' data-d="-1" aria-label="Diminuir '+label+'">−</button>'+
    '<div class="st-v"><b>'+val+'</b><small>'+label+'</small></div>'+
    '<button class="st-b" data-a="'+action+'" '+attrs+' data-d="1" aria-label="Aumentar '+label+'">+</button></div>';
}
function bandStepper(i, action, attrs){
  var b=BANDS[clamp(i,0,BANDS.length-1)];
  return '<div class="stepper"><button class="st-b" data-a="'+action+'" '+attrs+' data-f="band" data-d="-1" aria-label="Elástico mais leve">−</button>'+
    '<div class="st-v"><b><span class="band-dot" style="background:'+b[1]+'"></span></b><small>'+b[0]+'</small></div>'+
    '<button class="st-b" data-a="'+action+'" '+attrs+' data-f="band" data-d="1" aria-label="Elástico mais forte">+</button></div>';
}
function starBtn(ex, p){
  var on = isStar(p, ex.id);
  return '<button class="star-b'+(on?' is-on':'')+'" data-a="star" data-id="'+ex.id+'" data-pid="'+p.id+'" aria-pressed="'+on+'" aria-label="'+(on?'Tirar dos recomendados':'Recomendar para '+esc(short(p)))+'">'+(on?'★':'☆')+'</button>';
}
function spark(vals){
  var pts=[]; vals.forEach(function(v,i){ if(v!=null) pts.push([i,v]); });
  if(pts.length<2) return '<span class="small muted">—</span>';
  var ys=pts.map(function(p){return p[1];}), lo=Math.min.apply(null,ys), hi=Math.max.apply(null,ys);
  if(hi===lo){ hi=lo+1; lo=lo-1; }
  var W=96, H=28, pad=4, n=vals.length;
  function X(i){ return pad+i*(W-2*pad)/Math.max(1,n-1); } function Y(v){ return H-pad-(v-lo)/(hi-lo)*(H-2*pad); }
  var pl=pts.map(function(p){ return X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1); }).join(' '), l=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><polyline points="'+pl+'" fill="none" stroke="var(--sand)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+X(l[0]).toFixed(1)+'" cy="'+Y(l[1]).toFixed(1)+'" r="3.2" fill="var(--ink)"/></svg>';
}
function niceMax(v){ return v<=10 ? 10 : v<=15 ? 15 : v<=20 ? 20 : v<=50 ? Math.ceil(v/5)*5 : Math.ceil(v/10)*10; }
// series: [{vals:[n|null], color, dash, name}]
function lineChart(series, labels, o){
  var n=labels.length;
  if(n<2) return '<p class="empty">'+(o.empty||'São precisas pelo menos 2 sessões para mostrar a evolução.')+'</p>';
  var all=[]; series.forEach(function(s){ s.vals.forEach(function(v){ if(v!=null) all.push(v); }); });
  if(!all.length) return '<p class="empty">Sem valores registados.</p>';
  var F = o.fmt || function(v){ return num(v)+(o.unit||''); };
  var W=520,H=200,L=o.fmt?72:46,R=30,T=26,B=30, lo=o.min!=null?o.min:0, hi=o.max!=null?o.max:niceMax(Math.max.apply(null,all)*1.12);
  function X(i){ return L+i*(W-L-R)/(n-1); } function Y(v){ return T+(1-(v-lo)/((hi-lo)||1))*(H-T-B); }
  var g='';
  [lo,(lo+hi)/2,hi].forEach(function(t){ g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'+
    '<text x="'+(L-8)+'" y="'+(Y(t)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+esc(F(t))+'</text>'; });
  var body='', ends=[];
  series.forEach(function(s, si){
    var d='', pen=false, pts=[];
    s.vals.forEach(function(v,i){ if(v==null){ pen=false; return; } d+=(pen?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1); pen=true; pts.push([i,v]); });
    if(!pts.length) return;
    if(series.length===1 && pts.length>1){
      var area='M'+X(pts[0][0]).toFixed(1)+','+Y(lo).toFixed(1)+pts.map(function(p){return 'L'+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1);}).join('')+'L'+X(pts[pts.length-1][0]).toFixed(1)+','+Y(lo).toFixed(1)+'Z';
      body+='<path d="'+area+'" fill="var(--sand-soft)"/>';
    }
    body+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.dash?2:2.5)+'"'+(s.dash?' stroke-dasharray="5 4"':'')+' stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(function(p,j){ var last=j===pts.length-1;
      body+='<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="'+(last?5:3)+'" fill="'+(last?s.color:'var(--surface)')+'" stroke="'+s.color+'" stroke-width="2"/>'; });
    ends.push({si:si, i:pts[pts.length-1][0], v:pts[pts.length-1][1]});
  });
  var lbl='';
  ends.forEach(function(x){
    var other = ends.find(function(o){return o!==x;});
    if(other && other.v===x.v && other.i===x.i && x.si>other.si) return;
    var above = !other || x.v>other.v || (x.v===other.v && x.si===0);
    var y = clamp(above ? Y(x.v)-11 : Y(x.v)+20, 12, H-B+2);
    lbl+='<text x="'+(X(x.i)+4).toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">'+esc(F(x.v))+'</text>';
  });
  var xl='<text x="'+X(0)+'" y="'+(H-6)+'" font-size="11" fill="var(--muted)">'+labels[0]+'</text>'+
         '<text x="'+X(n-1)+'" y="'+(H-6)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+labels[n-1]+'</text>';
  var legend = series.length>1 ? '<div class="legend">'+series.map(function(s){ return '<span><i class="'+(s.dash?'dash':'')+'" style="border-top-color:'+s.color+'"></i>'+esc(s.name)+'</span>'; }).join('')+'</div>' : '';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'">'+g+body+lbl+xl+'</svg>'+legend;
}
function painChart(asc){
  var ps = asc.filter(function(s){return s.painEnd!=null;});
  return lineChart([{vals:ps.map(function(s){return s.painEnd;}), color:'var(--ink)'}], ps.map(function(s){return fmtShort(s.date);}), {min:0,max:10,aria:'Dor no fim de cada sessão'});

function exSeries(p, exId){
  var ex=EX(exId), rows=exHistory(p.id, exId);
  var allSets=[].concat.apply([], rows.map(function(r){return r.e.sets;}));
  var f=metricFor(ex, allSets), uni=allSets.some(function(x){return x.side;});
  var labels=rows.map(function(r){return fmtShort(r.s.date);});
  var series = uni ? ['E','D'].map(function(sd){

  var o = f==='band' ? {fmt:bandName, min:0, max:BANDS.length-1} : {unit:unitOf(f)};
  return {labels:labels, series:series, o:o, f:f};
}

/* ---------- Biblioteca: filtros e listas ---------- */
function libFilter(o){
  var words=norm(o.q).split(/\s+/).filter(Boolean);
  return D.exercises.filter(function(e){
    if(o.freg && o.freg!=='para' && e.reg!==o.freg) return false;
    if(o.ftype && e.type!==o.ftype) return false;
    if(o.feq && e.eq!==o.feq) return false;
    if(words.length){
      var hay=norm(e.name+' '+(e.aka||[]).join(' ')+' '+e.reg+' '+e.type+' '+(EQ[e.eq]||'')+' '+(e.fam||'').split('|').pop()+(e.r==='band'?' elastico':''));
      return words.every(function(w){ return hay.indexOf(w)>=0; });
    }
    return true;
  });
}
// Se o exercício foi encontrado por outro nome (e não pelo nome principal), mostra esse nome
function akaTag(e, q){
  var w=norm(q||'').split(/\s+/).filter(Boolean); if(!w.length || !(e.aka||[]).length) return '';
  function has(t){ t=norm(t); return w.every(function(x){ return t.indexOf(x)>=0; }); }
  if(has(e.name)) return '';
  var hit=e.aka.filter(has)[0] || e.aka.filter(function(a){ return w.some(function(x){ return norm(a).indexOf(x)>=0; }); })[0];
  return hit ? '<span class="aka">também: '+esc(hit)+'</span>' : '';
}
// Ordena os resultados: primeiro os que começam pelo que se escreveu, depois os que o têm no nome, por fim os encontrados por outro nome
function byRank(list, q){
  var qq=norm(q).trim(), w=qq.split(/\s+/).filter(Boolean);
  function rank(e){ var n=norm(e.name); return n.indexOf(qq)===0?0 : n.indexOf(qq)>=0?1 : w.every(function(x){return n.indexOf(x)>=0;})?2 : 3; }
  return list.map(function(e,i){ return [rank(e), i, e]; }).sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; }).map(function(x){ return x[2]; });
}

    '<div class="p-actions">'+startBtn+(liveOther?'<p class="small muted">Há uma sessão em curso com outro paciente.</p>':'')+
      '<div class="row">'+(last?'<button class="btn btn-ghost" data-a="openReport" data-id="'+last.id+'">Último relatório</button>':'')+
      (canTest?'<button class="btn btn-ghost" data-a="testsOpen">Registar testes</button>':'')+'</div></div></div>'+
    '<div class="stats">'+
      '<div class="stat"><span class="label">Sessões</span><b>'+ss.length+'</b><span class="small muted">desde '+fmtDate(p.since)+'</span></div>'+
      '<div class="stat"><span class="label">Dor no fim da sessão</span><b>'+(p0?p0.painEnd+' → '+p1.painEnd:'—')+'</b><span class="small muted">primeira → última, de 0 a 10</span></div>'+
      '<div class="stat"><span class="label">Exercícios a progredir</span><b>'+(cmpN?upN+' de '+cmpN:'—')+'</b><span class="small muted">'+(cmpN?'carga ou volume acima da 1.ª vez':'a partir da 2.ª vez de cada exercício')+'</span></div>'+
      '<div class="stat"><span class="label">Última sessão</span><b>'+(last?rel(last.date):'—')+'</b><span class="small muted">'+(last?esc(TH(last.therapistId).name):'')+'</span></div>'+
    '</div>'+
    '<div class="cols">'+
      '<section class="card"><div class="card-head"><div><h3>Treino da próxima sessão</h3>'+(planBy?'<p class="small muted">'+planBy+'</p>':'')+'</div>'+(ready&&!liveHere?'<button class="btn btn-ghost" data-a="planOpen" data-id="'+p.id+'">Editar treino</button>':'')+'</div><div>'+plan+'</div></section>'+
      '<section class="card"><div class="card-head"><div><h3>★ Recomendados</h3><p class="small muted">Aparecem primeiro quando se escolhe um exercício para '+esc(short(p))+'</p></div><button class="btn btn-ghost" data-a="addExOpen" data-t="star">+ Recomendar</button></div><div>'+starList+'</div></section>'+

      '<section class="card"><div class="card-head"><h3>Evolução por exercício</h3>'+(exIds.length?'<select class="select" data-ch="chartEx" aria-label="Exercício">'+exIds.map(function(id){return '<option value="'+id+'"'+(id===chosen?' selected':'')+'>'+esc(EX(id).name)+'</option>';}).join('')+'</select>':'')+'</div>'+
        (chosen?exChart:'<p class="empty">Ainda sem exercícios registados.</p>')+'</section>'+

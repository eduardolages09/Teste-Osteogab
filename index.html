function notesCard(p){
  var list=allNotes().filter(function(n){return n.patientId===p.id;});
  return '<section class="card span-2"><div class="card-head"><div><h3>Notas</h3><p class="small muted">'+(list.length?list.length+' '+(list.length===1?'nota':'notas')+' · rápidas, de fim de sessão e de exercícios':'Tudo o que se escrever sobre '+esc(short(p))+' fica aqui')+'</p></div>'+
    '<div class="exc-actions">'+(list.length>4?'<button class="btn btn-ghost" data-a="notesOfPatient" data-id="'+p.id+'">Ver todas</button>':'')+'<button class="btn btn-primary" data-a="noteNew" data-pid="'+p.id+'">✎ Nova nota</button></div></div>'+
    (list.length ? '<div class="notes-col">'+noteTimeline(list.slice(0,4), {})+'</div>' : '<p class="empty">Ainda sem notas.</p>')+'</section>';
}

function setRow(ex, s, k, n){
  var a='data-k="'+k+'"';
  var main = stepper(VOL[ex.v].lbl, s[ex.v]!=null?num(s[ex.v]):'—', 'adj', a+' data-f="'+ex.v+'"');
  var res = ex.r==='kg' ? stepper('kg', num(s.load||0), 'adj', a+' data-f="load"')
    : ex.r==='band' ? bandStepper(s.band!=null?s.band:1, 'adj', a) : '';
  return '<div class="set'+(s.done?' is-done':'')+'"><span class="set-n">Série<b>'+n+'</b></span>'+res+main+
    '<button class="set-check" data-a="toggleSet" data-k="'+k+'" aria-pressed="'+s.done+'" aria-label="Série '+n+(s.side?' '+SIDE[s.side]:'')+' feita">✓</button></div>';
}
function liveBar(L, p, pr, n){
  return '<div class="live-bar"><span class="dot"></span><div class="who-live"><b>'+esc(p.alias)+'</b><span>'+esc(pr?pr.name:'Sem protocolo')+' · sessão n.º '+n+(p.side?' · lesão à '+(p.side==='E'?'esquerda':'direita'):'')+'</span></div>'+
    '<div class="live-time"><span id="timer">'+fmtDur(Date.now()-L.start)+'</span><button class="btn btn-note" data-a="noteNew" data-pid="'+p.id+'">✎ Nota</button><button class="btn btn-end" data-a="finishOpen">Terminar</button></div></div>';
}
// Histórico do paciente no exercício atual, para decidir a carga de hoje
function exHistToggle(p, ex){
  var n=exHistory(p.id, ex.id).length; if(!n) return '';
  return ui.histOpen ? '<button class="link small hist-t" data-a="histToggle">Esconder histórico</button>'+exHistPanel(p, ex)
    : '<button class="link small hist-t" data-a="histToggle">Ver histórico neste exercício ('+n+')</button>';
}
function exHistPanel(p, ex){
  var rows=exHistory(p.id, ex.id); if(!rows.length) return '';
  var pr=progRow(p, ex, rows), recent=rows.slice(-5).reverse();
  return '<div class="panel"><div class="panel-h"><span class="label">Histórico de '+esc(short(p))+' neste exercício</span>'+
      (pr.n>1?'<span class="small"><span class="muted">Desde a 1.ª vez:</span> <b class="'+pr.cls+'">'+esc(fmtVal(pr.f,pr.a))+' → '+esc(fmtVal(pr.f,pr.b))+(pr.chg&&pr.chg!=='='?' ('+esc(pr.chg)+')':'')+'</b></span>':'')+'</div>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Realizado</th><th>Dor</th><th class="hide-sm">Terapeuta</th></tr></thead><tbody>'+
    recent.map(function(r){ var t=TH(r.s.therapistId);
      return '<tr><td>'+fmtShort(r.s.date)+'<small>'+rel(r.s.date)+'</small></td><td>'+esc(fmtSets(ex, r.e.sets))+(r.e.note?'<small>'+esc(r.e.note)+'</small>':'')+'</td><td>'+painPill(r.e.pain)+'</td><td class="hide-sm">'+esc(t?first(t.name):'')+'</td></tr>'; }).join('')+
    '</tbody></table></div></div>';
}
function viewSession(){
  var L=D.live, p=PT(L.patientId), pr=PR(L.proto), n=sessionsOf(p.id).length+1;
  var list = L.entries.map(function(en,i){
    var st=entryState(en), x=EX(en.ex), dn=doneSets(en.sets).length;
    var icon = st==='done'?'✓':st==='skip'?'–':(i+1);
    return '<button class="ex-item is-'+st+(i===L.cur?' is-cur':'')+'" data-a="goto" data-i="'+i+'"><span class="ex-st">'+icon+'</span>'+
      '<span class="ex-name">'+esc(x.name)+(isStar(p,x.id)?'<span class="star-mini">★</span>':'')+(en.swappedFrom?'<small>alternativa</small>':en.added?'<small>acrescentado na sessão</small>':'')+'</span><span class="ex-count">'+dn+'/'+en.sets.length+'</span></button>';
  }).join('') + '<button class="ex-add" data-a="addExOpen" data-t="session">+ Exercício</button>';
  if(L.planNote) list = '<div class="plan-note"><b>Nota do treino</b>'+esc(L.planNote)+'</div>'+list;

  if(!L.entries.length){
    return '<div class="session">'+liveBar(L,p,pr,n)+'<aside class="ex-list" data-scroll-aside>'+list+'</aside>'+
      '<section class="ex-main" data-scroll><div class="exc"><div class="empty-big"><h2>Escolha o primeiro exercício</h2>'+
      '<p class="muted">A biblioteca tem '+D.exercises.length+' exercícios. Os recomendados e os recentes de '+esc(short(p))+' aparecem primeiro.</p>'+
      '<button class="btn btn-primary btn-big" data-a="addExOpen" data-t="session">+ Adicionar exercício</button></div></div></section></div>';
  }

  var e=cur(), ex=EX(e.ex), starOn=isStar(p, ex.id);
  var lastTxt = e.last ? 'Última vez ('+fmtShort(e.last.date)+' · '+esc(first(TH(e.last.t).name))+'): <b>'+esc(e.last.txt)+'</b>'+(e.last.pain!=null?' · dor '+e.last.pain+'/10':'')+(e.last.lsi!=null?' · simetria '+e.last.lsi+' %':'')
    : 'Primeira vez: valores '+(e.added?'sugeridos pela biblioteca':'do protocolo');

  var origId = e.swappedFrom || e.ex, orig = EX(origId);
  var swapPanel = '';
  if(ui.swapOpen){
    var alts = altsOf(orig).filter(function(a){return a!==e.ex;});
    if(e.swappedFrom) alts = [e.swappedFrom].concat(alts.filter(function(a){return a!==e.swappedFrom;}));
    swapPanel = '<div class="panel"><span class="label">Trocar '+esc(ex.name)+' por</span><div class="chips">'+
      alts.map(function(a){ return a===e.swappedFrom ? '<button class="chip" data-a="swapBack">↩ '+esc(EX(a).name)+' (original)</button>' : '<button class="chip chip-alt" data-a="swapTo" data-id="'+a+'">'+(isStar(p,a)?'★ ':'')+esc(EX(a).name)+'</button>'; }).join('')+
      '<button class="chip" data-a="addExOpen" data-t="swap">Outro da biblioteca…</button></div></div>';
  }
  var swapped = e.swappedFrom ? '<div class="swapped"><div class="swapped-top"><span>Alternativa a <b>'+esc(orig.name)+'</b>. Motivo:</span><button class="link" data-a="swapBack">Voltar ao original</button></div>'+
    '<div class="chips">'+REASONS.map(function(r){return '<button class="chip'+(e.reason===r?' is-on':'')+'" data-a="reason" data-r="'+esc(r)+'">'+esc(r)+'</button>';}).join('')+'</div></div>' : '';
  var sugg = '';
  if(e.sugg && !e.suggDone && !e.sets.some(function(s){return s.done;})){
    sugg = e.sugg.dir===0 ? '<div class="sugg is-hold"><span>'+esc(e.sugg.txt)+'</span></div>'
      : '<div class="sugg'+(e.sugg.dir<0?' is-down':'')+'"><span>'+esc(e.sugg.lead)+'<b>'+esc(e.sugg.txt)+'</b></span><button class="btn btn-ghost" data-a="applySugg">Aplicar</button></div>';
  }

  var sets;
  if(!ex.uni){
    sets = '<div class="sets">'+e.sets.map(function(s,k){ return setRow(ex,s,k,k+1); }).join('')+'</div>';
  } else {
    var li = lsiEntry(ex, e.sets, p.side);
    var sidesBar = '<div class="sides-bar"><span class="label">Lados</span><div class="seg">'+
      [['ED','Os dois'],['E','Só esquerdo'],['D','Só direito']].map(function(o){ return '<button class="'+(e.sides===o[0]?'is-on':'')+'" data-a="sides" data-v="'+o[0]+'">'+o[1]+'</button>'; }).join('')+'</div>'+
      (li!=null && e.sides==='ED' ? '<span class="small muted">Simetria hoje</span> '+lsiPill(li) : '')+'</div>';
    sets = sidesBar+'<div class="sides-grid">'+sidesOf(e).map(function(sd){
      var rows='', c=0;
      e.sets.forEach(function(s,k){ if(s.side===sd){ c++; rows+=setRow(ex,s,k,c); } });
      return '<div class="side-col"><div class="side-h">'+SIDE[sd]+(p.side===sd?'<span class="pill pill-sand">lesionado</span>':'')+'</div><div class="sets">'+rows+'</div></div>';
    }).join('')+'</div>';
  }

  var allDoneEx = e.sets.every(function(s){return s.done;});
  var allComplete = L.entries.every(function(x){var st=entryState(x); return st==='done'||st==='skip';});
  var primary = allComplete ? '<button class="btn btn-primary btn-big grow" data-a="finishOpen">Terminar sessão</button>'
    : allDoneEx ? '<button class="btn btn-primary btn-big grow" data-a="next">Seguinte →</button>'
    : '<button class="btn btn-primary btn-big grow" data-a="allDone">✓ Tudo como previsto</button>';
  var canRemove = e.added && !e.sets.some(function(s){return s.done;});

  return '<div class="session">'+liveBar(L,p,pr,n)+
    '<aside class="ex-list" data-scroll-aside>'+list+'</aside>'+
    '<section class="ex-main" data-scroll><div class="exc">'+
      '<div class="exc-head"><div><p class="label">Exercício '+(L.cur+1)+' de '+L.entries.length+'</p><h2>'+esc(ex.name)+'</h2><p class="last">'+lastTxt+'</p></div>'+
      '<div class="exc-actions"><button class="btn btn-ghost star-t'+(starOn?' is-on':'')+'" data-a="star" data-id="'+ex.id+'" data-pid="'+p.id+'" aria-pressed="'+starOn+'">'+(starOn?'★ Recomendado':'☆ Recomendar')+'</button>'+
        '<button class="btn btn-ghost" data-a="swapToggle" aria-expanded="'+ui.swapOpen+'">⇄ Trocar</button>'+
        (canRemove?'<button class="btn btn-ghost" data-a="removeEx">Remover</button>':'<button class="btn btn-ghost" data-a="skip">Saltar</button>')+'</div></div>'+
      swapPanel+swapped+sugg+
      (allComplete?'<div class="all-done">Todos os exercícios estão registados. Pode terminar a sessão.</div>':'')+
      sets+
      '<div class="set-tools"><button class="btn btn-ghost" data-a="addSet">+ Série</button>'+(e.sets.length>sidesOf(e).length?'<button class="btn btn-ghost" data-a="rmSet">− Série</button>':'')+'</div>'+
      '<div class="pain-block"><div class="pain-h"><span class="label">Dor durante o exercício</span>'+(e.last&&e.last.pain!=null?'<span class="small muted">da última vez: '+e.last.pain+'</span>':'')+'</div>'+painScale(e.pain,'pain')+'</div>'+
      '<textarea id="exNote" class="note" data-in="exNote" rows="1" placeholder="Nota (opcional)">'+esc(e.note)+'</textarea>'+
      exHistToggle(p, ex)+
    '</div><div class="exc-foot"><button class="btn btn-ghost" data-a="prev" aria-label="Exercício anterior"'+(L.cur===0?' disabled':'')+'>←</button>'+primary+
      '<button class="btn btn-ghost" data-a="next" aria-label="Exercício seguinte">→</button></div></section></div>';
}

function miniSt(label, val, attrs){
  return '<div class="mini-st"><button class="st-b" data-a="bAdj" '+attrs+' data-d="-1" aria-label="Diminuir '+label+'">−</button>'+
    '<div class="st-v"><b>'+val+'</b><small>'+label+'</small></div><button class="st-b" data-a="bAdj" '+attrs+' data-d="1" aria-label="Aumentar '+label+'">+</button></div>';
}
function bVals(ex, t, i, sd){
  var a='data-i="'+i+'" data-sd="'+sd+'"';
  return miniSt(VOL[ex.v].lbl, num(t[ex.v]||0), a+' data-f="main"')+
    (ex.r==='kg' ? miniSt('kg', num(t.load||0), a+' data-f="load"')
      : ex.r==='band' ? miniSt(bandName(t.band!=null?t.band:1), '<span class="band-dot" style="background:'+BANDS[clamp(t.band!=null?t.band:1,0,6)][1]+'"></span>', a+' data-f="band"') : '');
}
function bItemHtml(p, it, i, n){
  var ex=EX(it.ex), lp=lastPerf(p.id, it.ex), sets=miniSt('séries', it.sets, 'data-i="'+i+'" data-sd="" data-f="sets"');
  var rows = it.per ? '<div class="b-row">'+sets+'</div>'+['E','D'].map(function(sd){
      return '<div class="b-row"><span class="b-side-lbl">'+sd+'</span>'+bVals(ex, it.per[sd], i, sd)+(p.side===sd?'<span class="pill pill-sand">lesionado</span>':'')+'</div>'; }).join('')
    : '<div class="b-row">'+sets+bVals(ex, it, i, '')+'</div>';
  var sg='';
  if(it.sg && !it.sgDone){
    sg = it.sg.dir===0 ? '<span class="sg-hold">Dor '+lp.e.pain+'/10 da última vez: manter</span>'
      : '<button class="sg-chip'+(it.sg.dir<0?' down':'')+'" data-a="bSugg" data-i="'+i+'">'+(it.sg.dir>0?'↑ ':'↓ ')+esc(it.sg.txt)+'</button>';
  }
  return '<div class="b-item"><div class="b-top"><span class="b-n">'+(i+1)+'</span><div class="b-name">'+esc(ex.name)+(ex.uni?'<span class="uni">E/D</span>':'')+(isStar(p,ex.id)?'<span class="star-mini">★</span>':'')+
      '<small>'+(lp?'Última vez ('+fmtShort(lp.s.date)+'): '+esc(fmtSets(ex, lp.e.sets))+(lp.e.pain!=null?' · dor '+lp.e.pain:''):'Primeira vez')+'</small></div>'+
      '<div class="b-ctrl"><button class="icon-b" data-a="bMove" data-i="'+i+'" data-d="-1" aria-label="Subir"'+(i===0?' disabled':'')+'>↑</button><button class="icon-b" data-a="bMove" data-i="'+i+'" data-d="1" aria-label="Descer"'+(i===n-1?' disabled':'')+'>↓</button>'+
      '<button class="icon-b" data-a="bRemove" data-i="'+i+'" aria-label="Tirar do treino">✕</button></div></div>'+
    rows+((sg||ex.uni)?'<div class="b-meta">'+sg+(ex.uni?'<button class="link small" data-a="bSplit" data-i="'+i+'">'+(it.per?'Mesmos valores nos dois lados':'Valores diferentes por lado')+'</button>':'')+'</div>':'')+'</div>';
}
function bRow(p, ex, inPlan){
  var lp=lastPerf(p.id, ex.id);
  return '<button class="b-add'+(inPlan?' is-in':'')+'" data-a="bToggle" data-id="'+ex.id+'" aria-pressed="'+inPlan+'"><span class="b-plus">'+(inPlan?'✓':'+')+'</span>'+demoThumb(ex.id)+
    '<span><span class="lib-name">'+esc(ex.name)+(ex.uni?'<span class="uni">E/D</span>':'')+(isStar(p,ex.id)?'<span class="star-mini">★</span>':'')+'</span>'+akaTag(ex, ui.bTab==='lib'?ui.bQ:'')+
    (lp?'<span class="lib-meta" style="display:block">Feito '+rel(lp.s.date)+'</span>':'')+'</span></button>';
}
function bList(p){
  var ids=p.plan.items.map(function(it){return it.ex;}), t=ui.bTab, last=sessionsOf(p.id)[0], pr=PR(p.proto);
  function rows(list){ return list.map(function(ex){ return bRow(p, ex, ids.indexOf(ex.id)>=0); }).join(''); }
  function missing(list){ return list.filter(function(ex){ return ids.indexOf(ex.id)<0; }).length; }
  if(t==='last'){
    if(!last) return '<p class="lib-hint">Ainda não há treinos anteriores.</p>';
    var l=uniq(last.entries.filter(function(e){return !e.skipped && doneSets(e.sets).length;}).map(function(e){return e.ex;})).map(EX).filter(Boolean), m=missing(l);
    return '<p class="small muted">Treino de '+fmtShort(last.date)+' · '+esc(first(TH(last.therapistId).name))+'</p>'+
      (m?'<button class="btn btn-primary b-all" data-a="bCopyLast">+ Juntar todos ('+m+')</button>':'')+rows(l);
  }
  if(t==='stars'){

function reportText(s){
  var p=PT(s.patientId), t=TH(s.therapistId), pr=PR(s.proto), n=sessionNumber(s);
  var upto=sessionsOf(p.id).filter(function(x){return x.date<=s.date;}).reverse(), pa=upto.filter(function(x){return x.painEnd!=null;})[0];
  var L = [];
  L.push(p.alias+' ('+p.code+') · Sessão n.º '+n);
  L.push(fmtLong(s.date)+' · '+s.durationMin+' min · '+t.name);
  if(pr) L.push('Protocolo: '+pr.name+(p.side?' · lado lesionado: '+sideTxt(p.side):''));
  if(p.goal) L.push('Objetivo: '+p.goal);
  L.push(''); L.push('EXERCÍCIOS');
  var skipped=[];
  s.entries.forEach(function(e){
    var ex=EX(e.ex); if(!ex) return;
    if(e.skipped || !doneSets(e.sets).length){ skipped.push(ex.name); return; }
    var dl=deltaInfo(ex,e,s), li=lsiEntry(ex,e.sets,p.side), line='• '+ex.name+': '+fmtSets(ex,e.sets)+' ('+dl.txt+')';
    if(li!=null) line+=' · simetria '+li+' %';
    if(e.pain!=null) line+=' · dor '+e.pain+'/10';
    if(e.swappedFrom){ var o=EX(e.swappedFrom); line+=' · alternativa a '+(o?o.name:'?')+(e.reason?' ('+e.reason.toLowerCase()+')':''); }
    L.push(line);
    if(e.note) L.push('   Nota: '+e.note);
  });
  if(skipped.length) L.push('Não realizados: '+skipped.join(', '));
  L.push(''); L.push('EVOLUÇÃO');
  L.push('Dor no fim da sessão: '+(s.painEnd==null?'não registada':(pa&&upto.length>1?pa.painEnd+'/10 na 1.ª sessão → ':'')+s.painEnd+'/10 hoje'));
  L.push('Sessões: '+n+' desde '+fmtDate(upto[0].date));
  (testTable(p, dayEnd(s.date))||[]).forEach(function(r){
    if(r.v0==null) return;
    L.push(r.name+(r.uni&&p.side?' (lado lesionado)':'')+': '+(r.n>1?num(r.v0)+' → ':'')+fu(r.v1, r.unit)+(r.l1!=null?' · simetria '+(r.n>1&&r.l0!=null?r.l0+' % → ':'')+r.l1+' %':''));
  });
  if(s.note){ L.push(''); L.push('NOTAS'); L.push(s.note); }
  return L.join('\n');
}

function calendar(o, counts){
  var y=+o.month.slice(0,4), m=+o.month.slice(5,7)-1, first=new Date(y,m,1), start=new Date(first), today=dkey(new Date());
  start.setDate(1-((first.getDay()+6)%7));

    '<div class="cal-grid">'+['seg','ter','qua','qui','sex','sáb','dom'].map(function(d){return '<span class="cal-dow">'+d+'</span>';}).join('');
  for(var i=0;i<42;i++){
    var d=new Date(start); d.setDate(start.getDate()+i); var k=dkey(d), c=counts[k]||0;
    if(i>=35 && d.getMonth()!==m) break;
    h+='<button class="cal-d'+(d.getMonth()!==m?' out':'')+(k===today?' today':'')+(k===o.day?' sel':'')+'" data-a="noteDay" data-k="'+k+'" aria-label="'+esc(dayLabel(k))+(c?', '+c+' notas':'')+'">'+d.getDate()+'<i class="'+(c?'':'none')+'"></i></button>';
  }
  return h+'</div>';
}

    var it=PR(ui.protoId).items[+d.i], ex=EX(it.ex), dir=+d.d, f=d.f;
    if(f==='sets') it.sets=clamp(it.sets+dir,1,10);
    else if(f==='main'){ var st=VOL[ex.v].step; it[ex.v]=clamp(rxMain(ex,it)+st*dir, st, 999); }
    else if(f==='band') it.band=clamp(rxBand(ex,it)+dir,0,BANDS.length-1);
    else it.load=stepLoad(it.load||0,dir);
    save(); render();
  },
  protoMove:function(d){ var items=PR(ui.protoId).items, i=+d.i, j=i+(+d.d); if(j<0||j>=items.length) return; var t=items[i]; items[i]=items[j]; items[j]=t; save(); render(); },
  protoRemove:function(d){ PR(ui.protoId).items.splice(+d.i,1); save(); render(); },
  testAdd:function(){ var pr=PR(ui.protoId); pr.tests.push({id:'t'+uid(), name:'Novo teste', unit:'°', uni:true, better:'up'}); save(); render(); focusSoon('tn'+(pr.tests.length-1)); },
  testRemove:function(d){ PR(ui.protoId).tests.splice(+d.i,1); save(); render(); },
  exOpen:function(d){ ui.modal={type:'exEdit', id:d.id}; render(); },
  exEditOpen:function(d){ ui.modal={type:'exEdit', id:d.id||null}; render(); focusSoon('exName'); },
  exSave:function(){
    function g(id){return document.getElementById(id);}
    var name=g('exName').value.trim();
    if(!name){ var er=g('exErr'); er.textContent='Escreva o nome do exercício.'; er.hidden=false; return; }
    var ex=ui.modal.id?EX(ui.modal.id):null;
    if(!ex){ ex={id:'x'+uid(), alts:[], fam:''}; D.exercises.push(ex); }
    ex.name=name; ex.reg=g('exReg').value; ex.type=g('exType').value; ex.eq=g('exEq').value;
    ex.v=g('exV').value; ex.r=g('exR').value; ex.uni=g('exUni').checked; ex.edited=true;
    ex.aka=g('exAka').value.split(/[,;]/).map(function(x){return x.trim();}).filter(Boolean);
    var st=VOL[ex.v].step, def={sets:clamp(parseInt(g('exSets').value,10)||3,1,10)};
    def[ex.v]=clamp(parseInt(g('exMain').value,10)||10, st, 999);
    if(ex.r==='kg') def.load=Math.max(0,parseNum(g('exLoad').value)||0);
    if(ex.r==='band') def.band=+g('exBand').value;
    ex.def=def;
    var chosen=[].slice.call(document.querySelectorAll('.alt-cb:checked')).map(function(c){return c.value;});
    var shown=[].slice.call(document.querySelectorAll('.alt-cb')).map(function(c){return c.value;});
    (ex.alts||[]).filter(function(a){return shown.indexOf(a)>=0 && chosen.indexOf(a)<0;}).forEach(function(a){ var o=EX(a); if(o) o.alts=o.alts.filter(function(x){return x!==ex.id;}); });
    chosen.forEach(function(a){ var o=EX(a); if(o && o.alts.indexOf(ex.id)<0) o.alts.push(ex.id); });
    ex.alts=(ex.alts||[]).filter(function(a){return shown.indexOf(a)<0;}).concat(chosen);
    exIdx=null; save(); ui.modal=null; render(); toast('Exercício guardado');
  },
  account:function(){ ui.modal={type:'account'}; render(); },
  logout:function(){ D.me=null; save(); releaseWake(); ui=freshUi(); render(); },
  resetAsk:function(){ ui.modal.confirmReset=true; render(); },
  reset:function(){ var m=D.me; D=seed(); D.me=m; exIdx=null; seedPlans(); releaseWake(); ui=freshUi(); render(); toast('Dados de demonstração repostos'); },
  noteNew:function(d){
    var pid = d.pid || (ui.view==='session' && D.live ? D.live.patientId : ui.view==='patient' ? ui.patientId : ui.view==='report' && SS(ui.sessionId) ? SS(ui.sessionId).patientId : null);
    ui.modal={type:'note', id:null, pid:pid, text:'', pq:''}; render(); focusSoon(pid?'noteText':'notePQ');
  },
  noteEdit:function(d){ var n=D.notes.find(function(x){return x.id===d.id;}); if(!n) return; ui.modal={type:'note', id:n.id, pid:n.patientId, text:n.text}; render(); focusSoon('noteText'); },
  notePick:function(d){ ui.modal.pid=d.id; render(); focusSoon('noteText'); },
  notePickClear:function(){ ui.modal.pid=null; ui.modal.pq=''; render(); focusSoon('notePQ'); },
  noteSave:function(){
    var m=ui.modal, text=(m.text||'').trim(), er=document.getElementById('nErr');
    if(!m.pid){ er.textContent='Escolha o paciente.'; er.hidden=false; return; }
    if(!text){ er.textContent='Escreva a nota.'; er.hidden=false; return; }
    if(m.id){ var n=D.notes.find(function(x){return x.id===m.id;}); n.text=text; n.editedAt=new Date().toISOString(); }
    else D.notes.push({id:'n'+uid(), patientId:m.pid, therapistId:D.me, date:new Date().toISOString(), text:text, sessionId: D.live && D.live.patientId===m.pid ? D.live.id : null});
    save(); ui.modal=null; render(); toast(m.id?'Nota atualizada':'Nota guardada · '+short(PT(m.pid)));
  },
  noteDelAsk:function(){ ui.modal.confirmDel=true; render(); },
  noteDelCancel:function(){ ui.modal.confirmDel=false; render(); },
  noteDel:function(){ var id=ui.modal.id; D.notes=D.notes.filter(function(x){return x.id!==id;}); save(); ui.modal=null; render(); toast('Nota apagada'); },
  notesOfPatient:function(d){ ui.view='notes'; ui.notes.mode='patient'; ui.notes.pid=d.id; ui.notes.q=''; ui.modal=null; render(); },
  notesMode:function(d){ ui.notes.mode=d.v; render(); },
  notesKind:function(d){ ui.notes.kind=d.v; render(); },
  notesPt:function(d){ ui.notes.pid=d.id; render(); },
  noteDay:function(d){ ui.notes.day=d.k; ui.notes.month=d.k.slice(0,7); render(); },
  dayStep:function(d){ var x=fromKey(ui.notes.day); x.setDate(x.getDate()+(+d.d)); ui.notes.day=dkey(x); ui.notes.month=ui.notes.day.slice(0,7); render(); },
  calMonth:function(d){ var y=+ui.notes.month.slice(0,4), m=+ui.notes.month.slice(5,7)-1+(+d.d), x=new Date(y,m,1); ui.notes.month=dkey(x).slice(0,7); render(); },
  planOpen:function(d){
    var p=PT(d.id||ui.patientId); ui.patientId=p.id;
    if(!p.plan) p.plan={items:[], note:'', by:D.me, at:new Date().toISOString()};
    ui.bTab = sessionsOf(p.id).length ? 'last' : (p.stars||[]).length ? 'stars' : PR(p.proto) ? 'proto' : 'lib';
    ui.bQ=''; ui.view='builder'; ui.modal=null; save(); render();
  },
  bDone:function(){ var p=PT(ui.patientId); if(p.plan && !p.plan.items.length) p.plan=null; save(); ui.view='patient'; render(); if(p.plan) toast('Treino guardado'); },
  bTab:function(d){ ui.bTab=d.v; render(); },
  bToggle:function(d){
    var p=PT(ui.patientId), items=p.plan.items, i=items.findIndex(function(it){return it.ex===d.id;});
    if(i>=0) items.splice(i,1); else items.push(newItem(d.id, p.id));
    p.plan.by=D.me; p.plan.at=new Date().toISOString(); save(); render();
  },
  bCopyLast:function(){
    var p=PT(ui.patientId), last=sessionsOf(p.id)[0], ids=p.plan.items.map(function(it){return it.ex;}), c=0;
    if(!last) return;
    last.entries.forEach(function(e){ if(!e.skipped && doneSets(e.sets).length && EX(e.ex) && ids.indexOf(e.ex)<0){ p.plan.items.push(newItem(e.ex, p.id)); ids.push(e.ex); c++; } });
    p.plan.by=D.me; p.plan.at=new Date().toISOString(); save(); render(); toast(c+' exercícios do último treino');
  },
  bProto:function(){
    var p=PT(ui.patientId), pr=PR(p.proto), ids=p.plan.items.map(function(it){return it.ex;});
    pr.items.forEach(function(it){ if(EX(it.ex) && ids.indexOf(it.ex)<0){ p.plan.items.push(newItem(it.ex, p.id, it)); ids.push(it.ex); } });
    save(); render();
  },
  bAdj:function(d){
    var p=PT(ui.patientId), it=p.plan.items[+d.i], ex=EX(it.ex), dir=+d.d, t=d.sd && it.per ? it.per[d.sd] : it;
    if(d.f==='sets') it.sets=clamp(it.sets+dir,1,10);
    else if(d.f==='main'){ var st=VOL[ex.v].step; t[ex.v]=Math.max(st,(t[ex.v]||0)+st*dir); }
    else if(d.f==='load') t.load=stepLoad(t.load||0,dir);
    else t.band=clamp((t.band!=null?t.band:1)+dir,0,BANDS.length-1);
    save(); render();
  },
  bSplit:function(d){
    var it=PT(ui.patientId).plan.items[+d.i], ex=EX(it.ex);
    if(it.per){ Object.assign(it, it.per[PT(ui.patientId).side||'E']); it.per=null; } else it.per={E:itemVals(ex,it), D:itemVals(ex,it)};
    save(); render();
  },
  bSugg:function(d){ applyItemSugg(PT(ui.patientId).plan.items[+d.i]); save(); render(); },
  bSuggAll:function(){ var n=0; PT(ui.patientId).plan.items.forEach(function(it){ if(it.sg && it.sg.dir && !it.sgDone){ applyItemSugg(it); n++; } }); save(); render(); toast(n+' '+(n===1?'sugestão aplicada':'sugestões aplicadas')); },
  bMove:function(d){ var items=PT(ui.patientId).plan.items, i=+d.i, j=i+(+d.d); if(j<0||j>=items.length) return; var t=items[i]; items[i]=items[j]; items[j]=t; save(); render(); },
  bRemove:function(d){ PT(ui.patientId).plan.items.splice(+d.i,1); save(); render(); },
  closeModal:function(){ ui.modal=null; render(); }
};
function focusSoon(id){ setTimeout(function(){ var i=document.getElementById(id); if(i) i.focus(); },30); }

document.addEventListener('click', function(ev){
  var el=ev.target.closest('[data-a]'); if(!el || el.disabled) return;
  var fn=A[el.dataset.a]; if(!fn) return;
  if(el.dataset.a==='noop'){ ev.stopPropagation(); return; }
  fn(el.dataset, el);
});
document.addEventListener('input', function(ev){
  var t=ev.target, k=t.dataset&&t.dataset.in; if(!k) return;
  if(k.indexOf('m.')===0){ ui.modal[k.slice(2)]=t.value; }
  else if(k==='q'){ ui.q=t.value; var g=document.getElementById('pgrid'); if(g) g.innerHTML=patientCards(); }
  else if(k==='exNote'){ cur().note=t.value; saveSoon(); }
  else if(k==='endNote'){ ui.modal.note=t.value; }
  else if(k==='protoName'){ PR(ui.protoId).name=t.value; saveSoon(); }
  else if(k==='protoDesc'){ PR(ui.protoId).desc=t.value; saveSoon(); }
  else if(k==='tName'){ PR(ui.protoId).tests[+t.dataset.i].name=t.value; saveSoon(); }
  else if(k==='tUnit'){ PR(ui.protoId).tests[+t.dataset.i].unit=t.value; saveSoon(); }
  else if(k==='pickQ'){ ui.modal.q=t.value; var l=document.getElementById('pickList'); if(l){ l.innerHTML=pickBody(); l.scrollTop=0; } }
  else if(k==='notesQ'){ ui.notes.q=t.value; var nb=document.getElementById('notesBody'); if(nb) nb.innerHTML=notesBody(); }
  else if(k==='notePQ'){ ui.modal.pq=t.value; var pl=document.getElementById('notePList'); if(pl) pl.innerHTML=notePatientList(); }
  else if(k==='bQ'){ ui.bQ=t.value; var bl=document.getElementById('bList'); if(bl) bl.innerHTML=bList(PT(ui.patientId)); }
  else if(k==='planNote'){ var pp=PT(ui.patientId); if(pp.plan){ pp.plan.note=t.value; saveSoon(); } }
  else if(k==='libQ'){ ui.lib.q=t.value; var ll=document.getElementById('libList'); if(ll) ll.innerHTML=libBody(); }
});
document.addEventListener('change', function(ev){
  var t=ev.target, k=t.dataset&&t.dataset.ch; if(!k) return;
  if(k.indexOf('m.')===0){ ui.modal[k.slice(2)]=t.value; }
  else if(k==='proto'){ PT(ui.patientId).proto=t.value; save(); render(); toast('Protocolo atualizado'); }
  else if(k==='chartEx'){ ui.chartEx=t.value; render(); }
  else if(k==='fType'){ fstate(t.dataset.s).ftype=t.value; render(); }
  else if(k==='fEq'){ fstate(t.dataset.s).feq=t.value; render(); }
  else if(k==='tUni'){ PR(ui.protoId).tests[+t.dataset.i].uni=t.checked; save(); }
  else if(k==='tDown'){ PR(ui.protoId).tests[+t.dataset.i].better=t.checked?'down':'up'; save(); }
  else if(k==='exV'){ document.getElementById('exMainLbl').textContent=VOL_NAME[t.value]; }
  else if(k==='exR'){ var r=t.value; [].forEach.call(document.querySelectorAll('[data-r]'),function(f){ f.hidden = f.dataset.r!==r; }); }
});
setInterval(function(){ var el=document.getElementById('timer'); if(el && D.live) el.textContent=fmtDur(Date.now()-D.live.start); },1000);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && D.live && D.me) requestWake(); });

// Na primeira abertura desta versão, a Marta já tem o próximo treino preparado pela Inês (para a demonstração)
function seedPlans(){
  var mp=PT('p7');
  if(mp && !mp.plan && !(D.live && D.live.patientId==='p7')){
    mp.plan={items:['pendulo','wallslide','reel','riel','elevlat','flexinc'].filter(EX).map(function(id){ var it=newItem(id, mp.id); applyItemSugg(it); return it; }),
      note:'Rever a dor noturna antes de começar. Trocar a flexão na parede pela inclinada.', by:'t2', at:new Date(Date.now()-50*60000).toISOString()};
  }
  D.plansV=1; save();
}
if(!D.plansV) seedPlans();
render();
})();
